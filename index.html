<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日記アプリ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ログインエリア -->
    <div class="auth-area" id="authArea">
        <button id="signInBtn" class="apple-signin-btn">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                <path d="M11.182.008C11.148-.03 9.923.023 8.857 1.18c-1.066 1.156-.902 2.482-.878 2.516.024.034 1.52.087 2.475-1.258.955-1.345.762-2.391.728-2.43zm3.314 11.733c-.048-.096-2.325-1.234-2.113-3.422.212-2.189 1.675-2.789 1.698-2.854.023-.065-.597-.79-1.254-1.157a3.692 3.692 0 0 0-1.563-.434c-.108-.003-.483-.095-1.254.116-.508.139-1.653.589-1.968.607-.316.018-1.256-.522-2.267-.665-.647-.125-1.333.131-1.824.328-.49.196-1.422.754-2.074 2.237-.652 1.482-.311 3.83-.067 4.56.244.729.625 1.924 1.273 2.796.576.984 1.34 1.667 1.659 1.899.319.232 1.219.386 1.843.067.502-.308 1.408-.485 1.766-.472.357.013 1.061.154 1.782.539.571.197 1.111.115 1.652-.105.541-.221 1.324-1.059 2.238-2.758.347-.79.505-1.217.473-1.282z"/>
            </svg>
            Appleでサインイン
        </button>
        <div id="userMenu" class="user-menu" style="display: none;">
            <button class="user-icon-btn" id="userIconBtn">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M10 10c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
            </button>
            <div class="dropdown-menu" id="dropdownMenu" style="display: none;">
                <div class="user-info" id="userInfo"></div>
                <button class="logout-btn" id="logoutBtn">ログアウト</button>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- 日付ヘッダー -->
        <div class="date-header">
            <div class="day-of-week" id="dayOfWeek">Sat</div>
            <div class="day-number" id="dayNumber">03</div>
            <div class="month-row">
                <div class="month-name" id="monthName">JANUARY</div>
                <div class="nav-buttons">
                    <button id="prevMonth" class="nav-btn">&lt;</button>
                    <button id="nextMonth" class="nav-btn">&gt;</button>
                </div>
            </div>
            <div class="year-number" id="yearNumber">2026</div>
        </div>

        <!-- カレンダービュー -->
        <div class="calendar-view">
            <div class="calendar-weekdays">
                <div class="weekday">月</div>
                <div class="weekday">火</div>
                <div class="weekday">水</div>
                <div class="weekday">木</div>
                <div class="weekday">金</div>
                <div class="weekday">土</div>
                <div class="weekday">日</div>
            </div>
            <div id="calendarDays" class="calendar-days"></div>
        </div>
    </div>

    <!-- 日記編集モーダル（全画面） -->
    <div id="diaryModal" class="modal">
        <div class="modal-header">
            <h3 id="modalDate"></h3>
            <button id="saveBtn" class="header-btn complete-btn">完了</button>
        </div>
        <div class="modal-body">
            <div id="diaryText" class="diary-content" contenteditable="true" data-placeholder="今日の出来事を書いてください..."></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
