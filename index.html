<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日記アプリ</title>
    <link rel="stylesheet" href="style.css">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>
    <!-- ログインエリア -->
    <div class="auth-area" id="authArea">
        <button id="signInBtn" class="signin-icon-btn">
            <img src="icon-user-unauth.svg" alt="ログイン" width="26" height="26">
        </button>
        <div id="userMenu" class="user-menu" style="display: none;">
            <button class="user-icon-btn" id="userIconBtn">
                <img src="icon-user-auth.svg" alt="ユーザー" width="26" height="26">
            </button>
            <div class="dropdown-menu" id="dropdownMenu" style="display: none;">
                <div class="user-info" id="userInfo"></div>
                <button class="logout-btn" id="logoutBtn">ログアウト</button>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- 日付ヘッダー -->
        <div class="date-header">
            <div class="day-of-week" id="dayOfWeek">Sat</div>
            <div class="day-number" id="dayNumber">03</div>
            <div class="month-row">
                <div class="month-name" id="monthName">JANUARY</div>
                <div class="nav-buttons">
                    <button id="prevMonth" class="nav-btn">&lt;</button>
                    <button id="nextMonth" class="nav-btn">&gt;</button>
                </div>
            </div>
            <div class="year-number" id="yearNumber">2026</div>
        </div>

        <!-- カレンダービュー -->
        <div class="calendar-view">
            <div class="calendar-weekdays">
                <div class="weekday">月</div>
                <div class="weekday">火</div>
                <div class="weekday">水</div>
                <div class="weekday">木</div>
                <div class="weekday">金</div>
                <div class="weekday">土</div>
                <div class="weekday">日</div>
            </div>
            <div id="calendarDays" class="calendar-days"></div>
        </div>
    </div>

    <!-- 日記編集モーダル（全画面） -->
    <div id="diaryModal" class="modal">
        <div class="modal-header">
            <h3 id="modalDate"></h3>
            <button id="saveBtn" class="header-btn complete-btn">完了</button>
        </div>
        <div class="modal-body">
            <div id="diaryText" class="diary-content" contenteditable="true" data-placeholder="今日の出来事を書いてください..."></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
